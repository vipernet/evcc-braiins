name: Build and Push Custom evcc Image

on:
  schedule:
    - cron: '0 3 * * 0' # Automatisch jeden Sonntag um 03:00 Uhr nachts
  workflow_dispatch: # Ermöglicht den manuellen Start per Klick im Webinterface

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Ermittelt die neueste evcc-Version über die GitHub API
      - name: Fetch latest evcc upstream release tag
        id: evcc_tag
        run: |
          TAG=$(curl -s https://github.com | jq -r .tag_name)
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Nutze neueste offizielle evcc Version: $TAG"

      # 2. Holt das offizielle evcc-Repository mit der eben ermittelten neuesten Version
      - name: Checkout official evcc repository
        uses: actions/checkout@v4
        with:
          repository: 'evcc-io/evcc'
          ref: ${{ steps.evcc_tag.outputs.latest_tag }}

      # 3. Lädt die Braiins-Dateien mit robuster Fehler-Wiederholung (Retry) herunter
      - name: Download Braiins custom driver files
        run: |
          mkdir -p charger templates/definition/charger
          curl --retry 5 --retry-delay 10 -sSL https://githubusercontent.com -o charger/braiins.go
          curl --retry 5 --retry-delay 10 -sSL https://githubusercontent.com -o templates/definition/charger/braiins.yaml
          echo "Braiins-Erweiterung erfolgreich in den Quellcode injiziert."

      # 4. Login in die GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Bereitet die Build-Umgebung vor
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Baut das Image mit dem originalen Dockerfile der jeweiligen evcc-Version
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.evcc_tag.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
