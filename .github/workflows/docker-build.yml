name: Build and Push Custom evcc Image

on:
  schedule:
    - cron: '0 3 * * 0' # Läuft automatisch jeden Sonntag um 03:00 Uhr nachts
  workflow_dispatch: # Ermöglicht es Ihnen, den Build jederzeit manuell in GitHub anzuklicken

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v4

      - name: Fetch latest evcc upstream release tag
        id: evcc_tag
        run: |
          TAG=$(curl -s https://github.com | jq -r .tag_name)
          echo "latest_tag=$TAG" >> $GITHUB_OUTPUT
          echo "Neueste offizielle evcc Version gefunden: $TAG"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Baut das Image basierend auf dem evcc-Quellcode und Ihren eingefügten Dateien
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.evcc_tag.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
