name: Build and Push Custom evcc Image

on:
  schedule:
    - cron: '0 3 * * 0' # Automatisch jeden Sonntag um 03:00 Uhr
  workflow_dispatch: # Ermöglicht den manuellen Start per Klick

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  EVCC_VERSION: 0.124.0 # Definiert die stabile evcc-Version passend zum Braiins-Code

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Holt das offizielle evcc-Repository mit der passenden Version
      - name: Checkout official evcc repository
        uses: actions/checkout@v4
        with:
          repository: 'evcc-io/evcc'
          ref: ${{ env.EVCC_VERSION }}
          fetch-depth: 1

      # 2. Lädt die Braiins-Dateien vollautomatisch herunter
      - name: Download Braiins custom driver files
        run: |
          mkdir -p charger templates/definition/charger
          curl --retry 5 --retry-delay 3 -sSL https://githubusercontent.com -o charger/braiins.go
          curl --retry 5 --retry-delay 3 -sSL https://githubusercontent.com -o templates/definition/charger/braiins.yaml
          echo "Braiins-Erweiterung erfolgreich in den Quellcode injiziert."

      # 3. Login in die GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Bereitet die Build-Umgebung vor
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Baut das Image mit dem originalen Dockerfile von evcc
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.EVCC_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
